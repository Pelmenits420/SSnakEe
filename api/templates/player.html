{% extends "base.html" %}

{% block content %}
    <h1>Spēlētāja profils</h1>
    <h2 style="text-align: center;">{{ name }}</h2>
    <div style="text-align: center; font-size: 20px; margin-top: 30px;">
        <p>Nospēlētās spēles: <strong>{{ stats.games_played }}</strong></p>
        <p>Labākais rezultāts: <strong>{{ stats.best_score }}</strong></p>
    </div>
    <div style="text-align: center; margin-top: 40px;">
        <a href="/" style="color: #ffc107; font-size: 18px;">Atpakaļ uz līderu tabulu</a>
    </div>
{% endblock %}
